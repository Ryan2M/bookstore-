<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EVER BOOKSTORE</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<header class="site-header">
<div class="brand">EVER <span>BOOKSTORE</span></div>
<nav>
<button id="refreshBtn">Refresh</button>
</nav>
</header>


<main class="container">
<section class="add-book">
<h2>Add a Book</h2>
<form id="bookForm">
<input id="title" placeholder="Title" required />
<input id="author" placeholder="Author" required />
<input id="price" type="number" step="0.01" placeholder="Price" required />
<button type="submit">Add Book</button>
</form>
</section>


<section class="books-list">
<h2>Available Books</h2>
<ul id="books"></ul>
</section>
</main>


<footer class="site-footer">&copy; <span id="year"></span> EVER BOOKSTORE</footer>


<script src="js/app.js"></script>
</body>
</html>
